apiVersion: loki.grafana.com/v1
kind: LokiStack
metadata:
  name: lokistack
  namespace: openshift-logging
spec:
  hashRing:
    type: memberlist
  limits:
    global:
      ingestion:
        ingestionBurstSize: 120
        ingestionRate: 60
      queries:
        queryTimeout: 3m
      retention:
        days: 1
  managementState: Managed
  size: 1x.pico
  storage:
    schemas:
      - effectiveDate: '2025-10-11'
        version: v13
    secret:
      name: loki-sec
      type: s3
    tls:
      caName: openshift-service-ca.crt
  storageClassName: ocs-external-storagecluster-ceph-rbd
  template:
    compactor:
      nodeSelector:
        node-role.kubernetes.io/infra-observe: ''
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/infra
          operator: Exists
    distributor:
      nodeSelector:
        node-role.kubernetes.io/infra-observe: ''
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/infra
          operator: Exists
    gateway:
      nodeSelector:
        node-role.kubernetes.io/infra-observe: ''
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/infra
          operator: Exists
    indexGateway:
      nodeSelector:
        node-role.kubernetes.io/infra-observe: ''
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/infra
          operator: Exists
    ingester:
      nodeSelector:
        node-role.kubernetes.io/infra-observe: ''
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/infra
          operator: Exists
    querier:
      nodeSelector:
        node-role.kubernetes.io/infra-observe: ''
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/infra
          operator: Exists
    queryFrontend:
      nodeSelector:
        node-role.kubernetes.io/infra-observe: ''
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/infra
          operator: Exists
  tenants:
    mode: openshift-logging