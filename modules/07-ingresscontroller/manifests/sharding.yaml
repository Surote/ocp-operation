apiVersion: operator.openshift.io/v1
kind: IngressController
metadata:
  name: sharded
  namespace: openshift-ingress-operator
spec:
  clientTLS:
    clientCA:
      name: ""
    clientCertificatePolicy: ""
  domain: swongpai.tt.local        #your domain
  httpEmptyRequestsPolicy: Respond
  httpErrorCodePages:
    name: ""
  endpointPublishingStrategy:
    type: NodePortService
# logging will not come by default
  logging:
    access:
      destination:
        type: Container
      logEmptyRequests: Log
  replicas: 1
# route need to add label for use this ingress
  routeSelector:
    matchLabels:
      type: sharded
  tuningOptions: {}
  unsupportedConfigOverrides: null