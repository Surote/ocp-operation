apiVersion: v1
kind: Namespace
metadata:
  name: 09-ts-lab
  labels:
    training.redhat.com/lab: 09-troubleshooting
    training.redhat.com/learner: lab
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: lab-case-05
  labels:
    training.redhat.com/lab: 09-troubleshooting
    training.redhat.com/case: '05'
value: 0
globalDefault: false
description: Scopes the case 05 ResourceQuota to case 05 pods only.
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: lab-pods-05
  namespace: 09-ts-lab
  labels:
    training.redhat.com/lab: 09-troubleshooting
    training.redhat.com/case: '05'
spec:
  hard:
    pods: '1'
  scopeSelector:
    matchExpressions:
      - scopeName: PriorityClass
        operator: In
        values:
          - lab-case-05
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-05
  namespace: 09-ts-lab
  labels:
    training.redhat.com/lab: 09-troubleshooting
    training.redhat.com/case: '05'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: troubleshooting-app-05
  template:
    metadata:
      labels:
        app: troubleshooting-app-05
        role: server
        training.redhat.com/case: '05'
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: quay.io/rh_ee_swongpai/fast-localtime-check:lw-d52838e1ff20e6ef1f92bc2422f98a9f93e7438b
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - "app:app"
            - --host
            - 0.0.0.0
            - --port
            - "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      priorityClassName: lab-case-05
---
apiVersion: v1
kind: Service
metadata:
  name: app-05
  namespace: 09-ts-lab
  labels:
    training.redhat.com/lab: 09-troubleshooting
    training.redhat.com/case: '05'
spec:
  selector:
    app: troubleshooting-app-05
  ports:
    - name: http
      port: 8080
      targetPort: http
