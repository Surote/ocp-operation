apiVersion: v1
kind: Namespace
metadata:
  name: 09-ts-lab
  labels:
    training.redhat.com/lab: 09-troubleshooting
    training.redhat.com/learner: lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-06
  namespace: 09-ts-lab
  labels:
    training.redhat.com/lab: 09-troubleshooting
    training.redhat.com/case: '06'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: troubleshooting-app-06
  template:
    metadata:
      labels:
        app: troubleshooting-app-06
        role: server
        training.redhat.com/case: '06'
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: quay.io/rh_ee_swongpai/fast-localtime-check:lw-d52838e1ff20e6ef1f92bc2422f98a9f93e7438b
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - "app:app"
            - --host
            - 0.0.0.0
            - --port
            - "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: app-06
  namespace: 09-ts-lab
  labels:
    training.redhat.com/lab: 09-troubleshooting
    training.redhat.com/case: '06'
spec:
  selector:
    app: troubleshooting-app-06
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagnostic-client-06
  namespace: 09-ts-lab
  labels:
    training.redhat.com/lab: 09-troubleshooting
    training.redhat.com/case: '06'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: diagnostic-client-06
  template:
    metadata:
      labels:
        app: diagnostic-client-06
        role: diagnostic-client
        training.redhat.com/case: '06'
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: client
          image: registry.access.redhat.com/ubi9/python-312:latest
          command:
            - sleep
            - infinity
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
