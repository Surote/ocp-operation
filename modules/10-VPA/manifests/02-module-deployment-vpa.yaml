apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-02-module
  namespace: 02-module
spec:
  resourcePolicy:
    containerPolicies:
    - containerName: '*'
      controlledValues: RequestsAndLimits
      controlledResources:
      - cpu
      - memory
      maxAllowed:
        cpu: 1
        memory: 500Mi
      minAllowed:
        cpu: 10m
        memory: 25Mi
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: timecheck-deployment
  updatePolicy:
    updateMode: InPlaceOrRecreate