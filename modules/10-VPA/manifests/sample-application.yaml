apiVersion: v1
kind: Namespace
metadata:
  name: 10-module
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timecheck-deployment
  namespace: 10-module
  labels:
    app: timecheck
spec:
  replicas: 2
  selector:
    matchLabels:
      app: timecheck
  template:
    metadata:
      labels:
        app: timecheck
    spec:
      containers:
        - name: timecheck-fastapi
          image: quay.io/rh_ee_swongpai/fast-localtime-check:lw-00e4965359725d3bcfb4707fcc34dbf453fb4851
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 5m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: timecheck-service
  namespace: 10-module
  labels:
    app: timecheck
spec:
  selector:
    app: timecheck
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: timecheck-route
  namespace: 10-module
  labels:
    app: timecheck
spec:
  to:
    kind: Service
    name: timecheck-service
  port:
    targetPort: 8000
  tls:
    termination: edge