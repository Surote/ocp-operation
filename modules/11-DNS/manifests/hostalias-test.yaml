apiVersion: v1
kind: Namespace
metadata:
  name: 11-dns-module
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostalias-test
  namespace: 11-dns-module
  labels:
    app: hostalias-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hostalias-test
  template:
    metadata:
      labels:
        app: hostalias-test
    spec:
      hostAliases:
        - ip: "10.0.0.100"
          hostnames:
            - "myapp.internal.example.com"
            - "myapp-alias.internal.example.com"
        - ip: "10.0.0.150"
          hostnames:
            - "db.internal.example.com"
        - ip: "10.0.0.200"
          hostnames:
            - "cache.internal.example.com"
      containers:
        - name: dns-test
          image: quay.io/rh_ee_swongpai/ubi9-toolbox:v0.0.2
          command:
            - /bin/sh
            - -c
            - |
              echo "=== /etc/hosts content ==="
              cat /etc/hosts
              echo ""
              echo "=== Testing hostAlias resolution ==="
              echo "Resolving myapp.internal.example.com:"
              getent hosts myapp.internal.example.com || echo "  -> not resolvable via DNS, but check /etc/hosts"
              echo "Resolving myapp-alias.internal.example.com:"
              getent hosts myapp-alias.internal.example.com || echo "  -> not resolvable via DNS, but check /etc/hosts"
              echo "Resolving db.internal.example.com:"
              getent hosts db.internal.example.com || echo "  -> not resolvable via DNS, but check /etc/hosts"
              echo "Resolving cache.internal.example.com:"
              getent hosts cache.internal.example.com || echo "  -> not resolvable via DNS, but check /etc/hosts"
              echo ""
              echo "=== Sleeping to keep pod alive ==="
              sleep infinity
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
