apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roundtable-operators
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/Surote/ocp-operation.git
    targetRevision: main
    path: prep/manifests
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
